name: "Run Project Status Checker"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  run-project-status-checker:
    name: Run Project Status Checker
    runs-on: ubuntu-latest
    permissions:
      contents: write # For committing changes to the repository
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Project Status Checker
        uses: JackPlowman/project-status-checker@354a9e9aefe8f0d6dca155a294a0f594973e9f35 # v1.1.0
        with:
          config_file_path: "github/workspace/status-checker-config.json"
          database_file_path: "github/workspace/status-checker-database.db"
      - name: Commit & Push changes
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc # v1.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
